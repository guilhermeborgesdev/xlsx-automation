<main id="main_principal">
    <div id="uploads" class="panel">
        <label for="upload_arquivos" id="upload_label">Editar Planilhas</label>
            <p>Selecione arquivos .xlsx/.csv/ .xls</p>
            <input type="file" id="upload_arquivos" multiple accept=".xlsx, .csv, .xls"/>
    </div>

    <p id="processar_label">Faca upload dos arquivos para poder processa-los.</p>

    <button id="botao" class="btn btn-primary">Processar Planilhas</button>

    <div id="preview_planilhas" style="width:100% ; height: 400px" class="ag-theme-alpine"></div>
</main>
