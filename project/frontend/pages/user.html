<main id="main_usuarios">
    <section>
        <h2>Gestao de Usuarios</h2>
        <div id="lista_usuarios" style="width:100% ; height: 400px"></div>
        <div class="toolbar">
            <button id="adicionar_usuarios" class="btn btn-primary">Adicionar</button>
            <button id="editar_usuarios" class="btn btn-secondary">Editar</button>
            <button id="excluir_usuarios" class="btn btn-danger">Excluir</button>
        </div>
    </section>

    <div id="modal_Add_Usuario" class="overlay hidden">
        <div class="modal">
            <header class="modal-header">
                <h2 id="titulo-modal-user"></h2>
            </header>
            <form id="novoUsuario" class="modal-body">

                <label class="form-label">Nome: </label>
                <input type="text" name="nome" placeholder="Nome do Usuário" required>

                <label class="form-label">Login: </label>
                <input type="text" name="login" placeholder="Informe o CPF do Usuário" required>

                <label class="form-label">Senha: </label>
                <input type="password" name="senha" placeholder="Informe a senha do Usuário" required>

                <label class="form-label">Permissão: </label>
                <select name="permissao">
                    <option value="A">Administrador</option>
                    <option value="P">Padrão</option>
                </select>

                <footer class="modal-footer">
                    <button type="button" id="cancelar" class="btn btn-danger">Cancelar</button>
                    <button type="submit" form="novoUsuario" class="btn btn-primary">Cadastrar</button>
                </footer>
            </form>
        </div>
    </div>
</main>
